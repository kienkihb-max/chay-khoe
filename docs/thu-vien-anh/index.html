<style>
.ggrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:24px 0 0;padding:0;list-style:none}
.ggrid li{margin:0}
.gempty{margin:32px 0;color:var(--mut,#667);font-size:17px}
.ggrid button{display:block;padding:0;border:0;background:var(--line);cursor:zoom-in;width:100%;border-radius:8px;overflow:hidden}
.ggrid img{width:100%;aspect-ratio:3/2;height:auto;display:block;transition:transform .2s}
.ggrid button:hover img{transform:scale(1.03)}
.gcredit{margin-top:24px;color:var(--mut);font-size:13px}
#lb{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:100;display:none;align-items:center;justify-content:center;touch-action:pan-y}
#lb.open{display:flex}
#lb img{max-width:92vw;max-height:88vh;object-fit:contain}
#lb button{position:absolute;background:rgba(255,255,255,.15);color:#fff;border:0;font-size:26px;width:48px;height:48px;border-radius:50%;cursor:pointer}
#lb button:hover{background:rgba(255,255,255,.3)}
#lb .x{top:14px;right:14px}#lb .pv{left:14px;top:50%}#lb .nx{right:14px;top:50%}
@media (max-width:1023px){.ggrid{grid-template-columns:repeat(2,1fr)}}
@media (max-width:599px){.ggrid{grid-template-columns:1fr;gap:8px}#lb .pv,#lb .nx{top:auto;bottom:14px}}

<main class="wrap"><header class="listhead"><h1>Thư viện ảnh</h1></header>
<ul class="ggrid" id="grid"></ul>
<footer class="sitefoot">Hanoi Running Lab · Nội dung mang tính thông tin, không thay thế khám và chẩn đoán của bác sĩ.</footer></main>
<div id="lb" role="dialog" aria-modal="true" aria-label="Xem ảnh lớn" data-i18n-skip><button type="button" class="x" aria-label="Đóng">×</button><button type="button" class="pv" aria-label="Ảnh trước">‹</button><img alt=""><button type="button" class="nx" aria-label="Ảnh sau">›</button></div>
<script>
(function(){
var grid=document.getElementById('grid'),lb=document.getElementById('lb'),lbi=lb.querySelector('img');
var pics=[],idx=0,lastBtn=null;
function render(){
  if(!pics.length){var e=document.createElement("p");e.className="gempty";e.textContent="Ảnh đang được cập nhật.";grid.replaceWith(e);return}
  pics.forEach(function(p,i){
    var li=document.createElement('li'),b=document.createElement('button'),im=document.createElement('img');
    b.type='button';b.setAttribute('aria-label','Xem ảnh lớn: '+p.alt);
    im.src='img/'+p.file+'-sm.jpg';im.alt=p.alt;im.loading='lazy';im.width=p.w;im.height=p.h;
    b.appendChild(im);b.addEventListener('click',function(){open(i,b)});li.appendChild(b);grid.appendChild(li);
  });
}
function show(){var p=pics[idx];lbi.src='img/'+p.file+'.jpg';lbi.alt=p.alt}
function open(i,btn){idx=i;lastBtn=btn;show();lb.classList.add('open');lb.querySelector('.x').focus()}
function close(){lb.classList.remove('open');lbi.removeAttribute('src');if(lastBtn)lastBtn.focus()}
function step(d){idx=(idx+d+pics.length)%pics.length;show()}
lb.querySelector('.x').onclick=close;lb.querySelector('.pv').onclick=function(){step(-1)};lb.querySelector('.nx').onclick=function(){step(1)};
lb.addEventListener('click',function(e){if(e.target===lb)close()});
document.addEventListener('keydown',function(e){if(!lb.classList.contains('open'))return;if(e.key==='Escape')close();else if(e.key==='ArrowLeft')step(-1);else if(e.key==='ArrowRight')step(1)});
var sx=null;lb.addEventListener('touchstart',function(e){sx=e.touches[0].clientX},{passive:true});
lb.addEventListener('touchend',function(e){if(sx==null)return;var dx=e.changedTouches[0].clientX-sx;sx=null;if(Math.abs(dx)>50)step(dx<0?1:-1)});
fetch('data.json').then(function(r){return r.json()}).then(function(d){d.forEach(function(ev){ev.images.forEach(function(im){pics.push(im)})});render()});
})();
</script>
